[project]
name = "catalogo"
version = "0.1.0"
description = "Catálogo local de artigos fictícios do grupo de estudos (PROD-001)"
requires-python = ">=3.10"

[tool.ruff]
include = ["catalogo/**/*.py", "tests/**/*.py"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
# N818 pede sufixo inglês "Error"; exceções do domínio usam o prefixo português "Erro" (DS-07 R1).
ignore = ["N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
