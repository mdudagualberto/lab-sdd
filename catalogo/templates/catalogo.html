<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de artigos</title>
</head>
<body>
  <main>
    <h1>Catálogo de artigos</h1>
    <ul>
      {% for artigo in artigos %}
      <li>{{ artigo.titulo }} · {{ artigo.autores | join(", ") }} · {{ artigo.ano }}</li>
      {% endfor %}
    </ul>
  </main>
</body>
</html>
